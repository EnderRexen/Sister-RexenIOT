<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Sister RexenIOT</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23ff8fb1' stroke-width='2'/><circle cx='16' cy='16' r='5' fill='%23ff8fb1'/></svg>" />
</head>
<body class="hud" data-view="chat">
  <!-- ============================ boot / first run ========================= -->
  <div id="boot" class="boot">
    <div class="boot-inner">
      <div class="boot-ring"><span></span><span></span><span></span></div>
      <h1 class="boot-title">Sister RexenIOT</h1>
      <p class="boot-status" id="boot-status">Initialising…</p>
    </div>
  </div>

  <!-- ================================ shell ================================ -->
  <div class="app" id="app" hidden>
    <!-- ------------------------------- header ------------------------------ -->
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".5"/>
          <circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".8"/>
          <circle class="brand-core" cx="16" cy="16" r="4" fill="currentColor"/>
        </svg>
        <div class="brand-text">
          <span class="brand-name">Sister RexenIOT</span>
          <span class="brand-sub" id="brand-sub">keeper of the house</span>
        </div>
      </div>

      <div class="persona-picker">
        <button class="persona-current" id="persona-button" aria-haspopup="listbox" aria-expanded="false">
          <span class="persona-dot" id="persona-dot"></span>
          <span class="persona-meta">
            <span class="persona-name" id="persona-name">Sister RexenIOT</span>
            <span class="persona-tag" id="persona-tag">loading…</span>
          </span>
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <ul class="persona-list" id="persona-list" role="listbox" hidden></ul>
      </div>

      <nav class="top-actions">
        <span class="pill" id="llm-pill" title="Model backend"><i class="dot"></i><span>model</span></span>
        <span class="pill" id="tts-pill" title="Speech engine"><i class="dot"></i><span>voice</span></span>
        <button class="icon-btn" id="btn-mute" title="Mute spoken replies" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="btn-keyboard" title="On-screen keyboard" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2" y="6" width="20" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 13.5h.01M18 13.5h.01M9 13.5h6"
                  stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn" id="btn-fullscreen" title="Full screen" aria-pressed="false" hidden>
          <svg class="fs-enter" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9V5a1 1 0 011-1h4M20 9V5a1 1 0 00-1-1h-4M4 15v4a1 1 0 001 1h4M20 15v4a1 1 0 01-1 1h-4"
                  fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          </svg>
          <svg class="fs-exit" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 4v4a1 1 0 01-1 1H4M15 4v4a1 1 0 001 1h4M9 20v-4a1 1 0 00-1-1H4M15 20v-4a1 1 0 011-1h4"
                  fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn" id="btn-admin" title="Admin panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13a7.7 7.7 0 000-2l2-1.5-2-3.4-2.4 1a7.7 7.7 0 00-1.7-1L14.9 3h-3.8l-.4 2.6a7.7 7.7 0 00-1.7 1l-2.4-1L4.6 9 6.6 10.9a7.7 7.7 0 000 2L4.6 14.5l2 3.4 2.4-1a7.7 7.7 0 001.7 1l.4 2.6h3.8l.4-2.6a7.7 7.7 0 001.7-1l2.4 1 2-3.4L19.4 13z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </nav>
    </header>

    <!-- ------------------------------- stage ------------------------------- -->
    <main class="stage">
      <!-- conversation -->
      <section class="conversation" id="conversation" aria-live="polite">
        <div class="messages" id="messages"></div>

        <div class="tool-tray" id="tool-tray" hidden>
          <span class="tool-label">Activity</span>
          <ul id="tool-list"></ul>
        </div>
      </section>

      <!-- side column -->
      <aside class="rail">
        <div class="reactor" id="reactor" aria-hidden="true">
          <svg viewBox="0 0 200 200">
            <defs>
              <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="var(--accent)" stop-opacity=".95"/>
                <stop offset="70%" stop-color="var(--accent)" stop-opacity=".18"/>
                <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <circle class="ring ring-1" cx="100" cy="100" r="88"/>
            <circle class="ring ring-2" cx="100" cy="100" r="70"/>
            <circle class="ring ring-3" cx="100" cy="100" r="52"/>
            <g class="tick-marks" id="ticks"></g>
            <circle class="core-glow" cx="100" cy="100" r="46" fill="url(#coreGrad)"/>
            <circle class="core" cx="100" cy="100" r="16"/>
          </svg>
          <canvas id="viz" class="viz" width="320" height="120"></canvas>
          <div class="reactor-state" id="reactor-state">IDLE</div>
          <div class="speech-source" id="speech-source" title="Which engine is speaking"></div>
        </div>

        <div class="rail-block">
          <h3>System</h3>
          <dl class="stats" id="stats">
            <div><dt>Model</dt><dd id="s-model">—</dd></div>
            <div><dt>Speech</dt><dd id="s-tts">—</dd></div>
            <div><dt>Home</dt><dd id="s-home">—</dd></div>
            <div><dt>Tools</dt><dd id="s-tools">—</dd></div>
          </dl>
        </div>

        <div class="rail-block" id="reminder-block" hidden>
          <h3>Timers</h3>
          <ul class="reminders" id="reminders"></ul>
        </div>
      </aside>
    </main>

    <!-- ------------------------------- composer ---------------------------- -->
    <footer class="composer">
      <button class="mic" id="btn-mic" title="Push to talk (hold, or press Space)" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/>
          <path d="M6 11a6 6 0 0012 0M12 17v3M9 21h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="mic-halo"></span>
      </button>

      <form class="input-wrap" id="form">
        <div class="attach-strip" id="attach-strip" hidden></div>
        <textarea id="input" rows="1" placeholder="Speak or type a command…" autocomplete="off" spellcheck="false"></textarea>
        <div class="input-hints">
          <span class="kbd-hints"><kbd>Enter</kbd> send · <kbd>Shift</kbd>+<kbd>Enter</kbd> newline</span>
          <span class="listen-hint" id="listen-hint" hidden>listening…</span>
          <span class="wake-badge" id="wake-badge" hidden></span>
        </div>
      </form>

      <input type="file" id="file-input" multiple hidden
             accept=".txt,.md,.csv,.json,.yaml,.yml,.toml,.ini,.log,.xml,.html,.css,.js,.ts,.py,.sh,.ps1,.sql,.pdf,.png,.jpg,.jpeg,.gif,.webp,.zip,.wav,.mp3" />

      <button class="attach" id="btn-attach" title="Attach a file for her to read">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>

      <button class="wake" id="btn-wake" title="Always listening for the wake word" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
          <path d="M7.5 7.5a6.4 6.4 0 000 9M16.5 7.5a6.4 6.4 0 010 9M4.5 4.5a10.6 10.6 0 000 15M19.5 4.5a10.6 10.6 0 010 15"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>

      <button class="send" id="btn-send" title="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 8 6 8-16-8z" fill="currentColor"/></svg>
      </button>
    </footer>

    <!-- --------------------------- on-screen keyboard ---------------------- -->
    <!-- Optional soft keyboard, for touch screens and kiosks with no physical
         keys. The outer element is the slot, clipped to zero height when shut;
         the tray inside slides out of it. Rows are built in JS from one layout
         table so left/right shift and the symbol layer stay in sync. -->
    <section class="osk" id="osk" hidden aria-label="On-screen keyboard">
      <div class="osk-tray">
        <div class="osk-lip" aria-hidden="true"><span class="osk-sweep"></span></div>
        <div class="osk-bar">
          <span class="osk-title">On-screen keyboard</span>
          <span class="osk-modes" role="group" aria-label="Keyboard layout">
            <button class="osk-mode active" data-layout="letters" type="button">ABC</button>
            <button class="osk-mode" data-layout="symbols" type="button">#+=</button>
          </span>
          <button class="osk-close" id="osk-close" type="button" title="Hide keyboard">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="osk-rows" id="osk-rows"></div>
      </div>
    </section>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <audio id="player" hidden></audio>

  <script src="/js/app.js" type="module"></script>
</body>
</html>
